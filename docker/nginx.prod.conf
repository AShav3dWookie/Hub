# Reference nginx config for hub.aaronhanna.uk — drop this `server {}` into your
# host nginx (it is NOT loaded by any compose file here). Assumes:
#   Cloudflare (DNS + TLS + WAF)  ->  this nginx (LAN TLS)  ->  app container :3000
#
# The app is Authelia-UNAWARE by design: Authelia (if you enable the block below)
# gates at nginx, and the app keeps its own separate password login behind it.
# See docs/wan-security.md.

server {
  listen 443 ssl http2;
  server_name hub.aaronhanna.uk;

  # --- your existing LAN TLS cert ---
  # ssl_certificate     /etc/nginx/certs/hub.aaronhanna.uk.crt;
  # ssl_certificate_key /etc/nginx/certs/hub.aaronhanna.uk.key;

  # Matches the app's upload ceiling: 250 MB/video, ~900 MB per request
  # (the app's rejectOversizeUpload middleware is the real gate).
  client_max_body_size 1000m;
  proxy_request_buffering off;
  proxy_read_timeout 300s;
  proxy_cache off;

  # --- OPTIONAL: trust Cloudflare's real client IP -------------------------
  # Keep this list current from https://www.cloudflare.com/ips/
  # set_real_ip_from 173.245.48.0/20;
  # set_real_ip_from 103.21.244.0/22;
  # ... (all Cloudflare ranges) ...
  # real_ip_header CF-Connecting-IP;

  # --- OPTIONAL: Authelia forward-auth (nginx-level; the app ignores these headers) ---
  # location = /internal/authelia/authz {
  #   internal;
  #   proxy_pass http://authelia:9091/api/authz/auth-request;
  #   proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
  #   proxy_set_header Content-Length "";
  #   proxy_pass_request_body off;
  # }

  location / {
    # auth_request /internal/authelia/authz;                       # enable with the block above
    # error_page 401 =302 https://auth.aaronhanna.uk/?rd=$scheme://$http_host$request_uri;

    proxy_pass http://127.0.0.1:3000;      # or the container's address on your network
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # this nginx terminated TLS for the app
    proxy_set_header Connection "";
  }

  # --- FUTURE: server-sent events / web-push endpoint --------------------------
  # When the push-notifications feature lands it will want its own location with
  # buffering off and a long read timeout:
  # location /api/notifications/stream {
  #   proxy_pass http://127.0.0.1:3000;
  #   proxy_http_version 1.1;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-Proto https;
  #   proxy_buffering off;
  #   proxy_read_timeout 3600s;
  # }
}
