# Reverse proxy for the local auth test rig (docker-compose.auth.yml).
#
# Mirrors the production edge: TLS is terminated upstream (Cloudflare in prod, and
# pretended here), so this listens on plain HTTP but hard-sets `X-Forwarded-Proto:
# https`. With `TRUST_PROXY=1` the app then treats the connection as secure and
# marks the session cookie `Secure` — which http://localhost still stores and
# resends, so the full cookie round-trip is genuinely exercised.
worker_processes 1;
events { worker_connections 256; }

http {
  # Matches the app's upload ceiling: 250 MB/video, ~900 MB per request.
  client_max_body_size 1000m;
  proxy_read_timeout 300s;
  proxy_request_buffering off;
  proxy_cache off;

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;   # pretend TLS was terminated upstream
      proxy_set_header Connection "";
    }
  }
}
