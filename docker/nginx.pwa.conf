# Reverse proxy in front of the app container, mirroring the production topology
# (Cloudflare → nginx → app). TLS is Cloudflare's job in production, so this listens
# on plain HTTP; `X-Forwarded-Proto` is set so the app can behave as if terminated.
worker_processes 1;
events { worker_connections 256; }

http {
  # Photo uploads: 10 MB/file × up to 10 files, plus multipart overhead.
  client_max_body_size 120m;
  proxy_read_timeout 120s;

  # Never let a proxy cache the shell / service worker / manifest — the app sets
  # its own Cache-Control and this just makes sure nothing here overrides it.
  proxy_cache off;

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }
  }
}
