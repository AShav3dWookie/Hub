# PRODUCTION — the home server. This is the only compose file meant to run there, and it never
# builds: the image is pulled from GHCR, published by .github/workflows/release.yml when a
# `vX.Y.Z` tag is pushed.
#
# The package is private, so the host needs credentials once:
#   echo <PAT> | docker login ghcr.io -u AShav3dWookie --password-stdin
# Deploying through Portainer instead? Add ghcr.io under Settings -> Registries and paste this
# file into a stack; set the variables below in the stack's environment fields.
#
#   cp .env.prod.example .env    # then fill it in
#
# Deploy / upgrade:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#   curl -s localhost:8090/api/health      # confirms which version is live
#
# Rollback: set IMAGE_TAG to the previous version in .env and repeat those two commands.
#
# NOTE the project name below is `hub`, the same as the dev docker-compose.yml gets from its
# directory name. On a dev machine always add `-p hub-prod-test`, or this will recreate the
# local hub-app-1 container from the registry image.
#
# Full guide: docs/deployment.md.

name: hub

services:
  app:
    image: ghcr.io/ashav3dwookie/hub:${IMAGE_TAG:-latest}
    # Published on the LAN, not bound to 127.0.0.1: host nginx proxies to it (see
    # docker/nginx.prod.conf). That also means http://<lan-ip>:${HOST_PORT} reaches the app
    # directly, bypassing nginx and therefore Authelia — which is why AUTH_ENABLED defaults to
    # true here. Close it with a firewall rule if you want only nginx to reach it.
    ports:
      - "${HOST_PORT:-8090}:3000"
    # Config comes from .env next to this file (copy .env.prod.example), or from the stack's
    # environment-variable fields if you deploy through Portainer. Written as explicit `${VAR}`
    # substitution rather than `env_file` so that both routes work: Portainer feeds substitution,
    # and does not reliably materialise a .env file for env_file to read.
    #
    # ⚠️ AUTH_PASSWORD_HASH must have every `$` doubled to `$$`, wherever you put it — .env or a
    # Portainer field. Compose interpolates both, so a raw bcrypt hash has its salt eaten by
    # variable expansion and every login then fails with nothing in the logs.
    # `npm run auth:hash -- 'pw' | sed 's/\$/$$/g'` emits the escaped form.
    environment:
      - PORT=3000
      - NODE_ENV=production
      # PHOTOS_DIR derives from dirname(DB_PATH), so photos share the volume below.
      - DB_PATH=/app/data/logger.db
      # Defaults to ON deliberately: an unset variable must not silently expose the app.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      # No usable fallback: with auth on, assertSecureConfig refuses to start on the placeholder
      # rather than signing real sessions with a secret that is public in this repo.
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - SESSION_MAX_AGE_DAYS=${SESSION_MAX_AGE_DAYS:-}
    volumes:
      - data:/app/data
    restart: unless-stopped
    # No healthcheck block: the image carries a HEALTHCHECK and compose inherits it.

volumes:
  data:
    # Pinned, so the real volume is `hub-data` rather than `<project>_data` and stays findable
    # for backups whatever the project is called.
    name: hub-data
