# Isolated, production-shaped instance of the app for hands-on PWA testing.
#
#   npm run pwa:up        # build + start   → http://localhost:3200
#   npm run pwa:down      # stop, keep the data
#   npm run pwa:reset     # stop + wipe the data
#
# Topology mirrors the home-server deployment (Cloudflare → nginx → app container):
#
#   browser ──▶ nginx  (:3200, this compose)  ──▶ app  (Express, internal :3000)
#                                                  ├─ /api/*        the backend
#                                                  └─ everything else  the built PWA
#                                                     (static HTML/JS/CSS + sw.js +
#                                                      manifest) from server/public
#
# There is no "client server": the PWA is a static bundle built once and served by
# the app container. In the browser, the "client" is the installed app + its
# service worker + IndexedDB — none of which live in a container.
#
# Its own compose project name, port and named volume, so it never touches the
# :3000 instance or test-env/.

name: logger-pwa

services:
  seed:
    build: { context: ., target: runtime }
    image: logger-pwa:local
    working_dir: /app/server
    environment:
      DB_PATH: /data/logger.db
    volumes:
      - pwa-data:/data
    entrypoint: ["sh", "-c"]
    command:
      - >
        test -f /data/logger.db
        && echo 'DB already present — leaving it alone'
        || node dist/scripts/seedTestData.js

  app:
    build: { context: ., target: runtime }
    image: logger-pwa:local
    depends_on:
      seed:
        condition: service_completed_successfully
    expose:
      - "3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_PATH: /data/logger.db
      AUTH_ENABLED: "false"
    volumes:
      - pwa-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "3200:80"
    volumes:
      - ./docker/nginx.pwa.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  pwa-data:
