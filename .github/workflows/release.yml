# Builds the production image and publishes it to GHCR.
#
# Trigger: pushing a semver tag (`v1.2.3`), which is what `npm run release` does. Nothing
# publishes on an ordinary push to main. The home server then pulls the tag with
# docker-compose.prod.yml. See docs/deployment.md.
name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Hardcoded, lowercase. The repo is AShav3dWookie/Hub but GHCR paths must be lowercase, and
  # only metadata-action would have normalised ${{ github.repository }} for us — anything that
  # bypassed it would fail with "repository name must be lowercase", in CI only.
  IMAGE_NAME: ghcr.io/ashav3dwookie/hub

jobs:
  test:
    name: build + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build first: it produces shared/dist, which the server and client typechecks, eslint's
      # type-aware rules and every test suite resolve against.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck:parity
      - run: npm test

  publish:
    name: publish to ghcr
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # Explicit rather than relying on the `latest=auto` default: this is what decides
          # whether an unset IMAGE_TAG on the server resolves to anything.
          flavor: latest=true
          # {{major}} is deliberately omitted — at 0.x it produces a bare "0", which is noise.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Supplies org.opencontainers.image.source, which is what links the GHCR package to
          # this repo (and grants the repo push access to it). Don't hand-write these.
          labels: ${{ steps.meta.outputs.labels }}
          # `version` is "1.2.3" for tag v1.2.3 — no leading v, matching package.json.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # Off on purpose: buildx defaults to provenance=mode=min under Actions, which turns a
          # single-platform image into an index and shows an "unknown/unknown" entry beside the
          # real one on the package page.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ''
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ''
            echo 'On the server: set `IMAGE_TAG` in `.env`, then'
            echo '`docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d`'
          } >> "$GITHUB_STEP_SUMMARY"
