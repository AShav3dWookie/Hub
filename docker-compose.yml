services:
  app:
    build: .
    image: logger:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_PATH=/app/data/logger.db
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      # The container's own data dir. Must NOT be the dir a local `npm run dev:server`
      # uses (test-env) — sharing one SQLite file between a host process and the
      # container over a bind mount breaks WAL (SQLITE_IOERR_SHMOPEN).
      - ./data:/app/data
    restart: unless-stopped
